# Включаем модуль ssl_preread
stream {
	server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend_name;
        proxy_socket_keepalive on;
    }

    upstream website_backend {
		server 127.0.0.1:8443;
	}

	upstream vpn_backend {
		server 127.0.0.1:10000;
	}

	map $ssl_preread_server_name $backend_name {
		example.com           website_backend;
		www.microsoft.com     vpn_backend;
		www.google.com     	  vpn_backend;
		www.apple.com     	  vpn_backend;
		www.bing.com    	  vpn_backend;
		www.samsung.com    	  vpn_backend;
		default               website_backend;
	}
}
